<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REYES_OS v2.6</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desktop:#b9c2b4;
    --desktop-dark:#9aa895;
    --window:#f2efe4;
    --window-border:#111;
    --chrome:#dcd6c2;
    --ink:#161611;
    --dim:#5c5a4d;
    --accent:#2d6e6e;
    --accent-dim:#4c8f8f;
    --warn:#b5501f;
    --shadow:4px 4px 0 rgba(0,0,0,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'IBM Plex Mono',monospace;
    background:var(--desktop);
    color:var(--ink);
    position:relative;
  }
  ::selection{background:var(--accent);color:#fff;}

  /* ---------------- boot screen ---------------- */
  #boot{
    position:fixed;inset:0;z-index:9999;background:#0d0f0c;color:#8fd9a8;
    font-family:'VT323',monospace;font-size:20px;line-height:1.5;padding:40px;
    display:flex;flex-direction:column;justify-content:flex-end;
    transition:opacity .5s ease;
  }
  #boot.hidden{opacity:0;pointer-events:none;}
  #boot-log p{opacity:0;animation:bootLine .1s forwards;white-space:pre;}
  #boot-cursor{display:inline-block;width:10px;height:18px;background:#8fd9a8;animation:blink 1s step-end infinite;margin-left:4px;}
  @keyframes bootLine{to{opacity:1;}}
  @keyframes blink{50%{opacity:0;}}

  /* ---------------- desktop ---------------- */
  #desktop{
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.06) 1px, transparent 0);
    background-size:5px 5px;
  }
  #desktop::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }

  .desktop-icons{
    position:absolute;top:26px;left:26px;display:flex;flex-direction:column;gap:26px;z-index:2;
  }
  .d-icon{
    width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    padding:6px;border:1px solid transparent;
  }
  .d-icon:hover{border:1px dashed var(--ink);}
  .d-icon .glyph{
    width:44px;height:44px;background:var(--window);border:2px solid var(--ink);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }
  .d-icon .label{
    font-size:11px;text-align:center;background:var(--desktop);color:var(--ink);padding:1px 4px;letter-spacing:0.5px;
  }

  /* ---------------- windows ---------------- */
  .window{
    position:absolute;background:var(--window);border:2px solid var(--window-border);
    box-shadow:var(--shadow);min-width:280px;display:flex;flex-direction:column;z-index:10;
  }
  .win-titlebar{
    background:repeating-linear-gradient(90deg, var(--ink) 0px, var(--ink) 2px, var(--chrome) 2px, var(--chrome) 4px);
    height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;cursor:grab;
    border-bottom:2px solid var(--window-border);
  }
  .win-titlebar:active{cursor:grabbing;}
  .win-title{
    background:var(--chrome);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:1px;
    padding:2px 10px;border:1px solid var(--ink);
  }
  .win-controls{display:flex;gap:5px;}
  .win-btn{
    width:16px;height:16px;background:var(--chrome);border:1px solid var(--ink);font-size:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;line-height:1;
  }
  .win-btn:hover{background:var(--accent);color:#fff;}
  .win-body{padding:18px 20px;overflow-y:auto;flex:1;font-size:14px;line-height:1.7;}
  .win-statusbar{
    border-top:2px solid var(--window-border);background:var(--chrome);font-size:10px;padding:3px 10px;
    display:flex;justify-content:space-between;color:var(--dim);letter-spacing:0.5px;
  }
  .win-resize{
    position:absolute;width:14px;height:14px;right:0;bottom:0;cursor:nwse-resize;
    background:repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 4px);
  }

  /* ---------------- taskbar ---------------- */
  #taskbar{
    position:fixed;left:0;right:0;bottom:0;height:40px;background:var(--ink);z-index:500;
    display:flex;align-items:center;padding:0 10px;gap:10px;border-top:2px solid #000;
  }
  #start-btn{
    background:var(--accent);color:#fff;border:2px solid #000;padding:5px 14px;font-family:'IBM Plex Mono';
    font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;box-shadow:2px 2px 0 #000;
  }
  #start-btn:hover{background:var(--accent-dim);}
  #task-items{display:flex;gap:8px;flex:1;overflow-x:auto;}
  .task-item{
    background:var(--chrome);border:1px solid #000;color:var(--ink);font-size:11px;padding:5px 12px;
    cursor:pointer;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;
  }
  .task-item.active{background:var(--accent);color:#fff;}
  #clock{color:#8fd9a8;font-family:'VT323',monospace;font-size:18px;padding:0 12px;letter-spacing:1px;white-space:nowrap;}

  /* ---------------- start menu ---------------- */
  #start-menu{
    position:fixed;bottom:44px;left:10px;width:230px;background:var(--window);border:2px solid var(--ink);
    box-shadow:var(--shadow);z-index:900;display:none;flex-direction:column;
  }
  #start-menu.open{display:flex;}
  #start-menu .sm-head{background:var(--accent);color:#fff;padding:10px 14px;font-weight:700;font-size:13px;letter-spacing:1px;}
  .sm-item{padding:10px 14px;font-size:13px;cursor:pointer;border-top:1px solid #d8d2bf;display:flex;gap:10px;align-items:center;}
  .sm-item:hover{background:var(--accent);color:#fff;}

  /* ---------------- app content styling ---------------- */
  h3.app-h{font-family:'VT323',monospace;font-size:22px;color:var(--accent);letter-spacing:1px;margin-bottom:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;}
  .kv-row{display:flex;justify-content:space-between;border-bottom:1px dotted #9c9782;padding:6px 0;font-size:12.5px;}
  .kv-row span:last-child{color:var(--accent);font-weight:600;}
  .ascii-divider{color:var(--dim);font-size:11px;letter-spacing:1px;margin:14px 0;overflow:hidden;white-space:nowrap;}

  .proj-entry{border:1px solid var(--ink);margin-bottom:14px;padding:12px 14px;background:#e9e4d3;cursor:pointer;}
  .proj-entry:hover{background:var(--accent);color:#fff;}
  .proj-entry:hover .proj-tag{color:#fff;border-color:#fff;}
  .proj-title{font-weight:700;font-size:13px;margin-bottom:4px;}
  .proj-sub{font-size:11.5px;color:var(--dim);margin-bottom:8px;}
  .proj-entry:hover .proj-sub{color:#e5f5f5;}
  .proj-tag{display:inline-block;font-size:10px;border:1px solid var(--ink);padding:2px 6px;margin-right:6px;margin-top:2px;}

  .meter-row{margin-bottom:14px;}
  .meter-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .meter-track{height:14px;border:1px solid var(--ink);background:#e2ddc9;position:relative;overflow:hidden;}
  .meter-fill{height:100%;background:repeating-linear-gradient(90deg, var(--accent) 0 6px, var(--accent-dim) 6px 12px);width:0%;transition:width 1.2s ease;}

  .term-out{background:#101410;color:#8fd9a8;font-family:'VT323',monospace;font-size:16px;padding:12px;height:150px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--ink);}
  .term-out p{margin-bottom:2px;}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
  .form-row input, .form-row textarea{
    width:100%;background:#fff;border:1px solid var(--ink);padding:7px 9px;font-family:'IBM Plex Mono';font-size:13px;outline:none;
  }
  .form-row input:focus, .form-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,110,110,0.2);}
  .send-btn{background:var(--accent);color:#fff;border:1px solid var(--ink);padding:9px 22px;font-family:'IBM Plex Mono';font-weight:700;font-size:12px;letter-spacing:1px;cursor:pointer;box-shadow:2px 2px 0 #000;}
  .send-btn:hover{background:var(--accent-dim);}

  .modal-mini{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1200;display:none;align-items:center;justify-content:center;}
  .modal-mini.open{display:flex;}
  .modal-mini-box{width:min(420px,86vw);background:var(--window);border:2px solid var(--ink);box-shadow:var(--shadow);padding:18px 20px;}
  .modal-mini-box p{font-size:13px;line-height:1.7;margin-bottom:14px;}
  .modal-mini-close{background:var(--ink);color:#fff;border:none;padding:7px 16px;font-family:'IBM Plex Mono';font-size:12px;cursor:pointer;}

  @media (max-width:700px){
    .window{min-width:82vw !important;}
  }
</style>
</head>
<body>

<div id="boot">
  <div id="boot-log"></div>
</div>

<div id="desktop">
  <div class="desktop-icons">
    <div class="d-icon" data-app="about"><div class="glyph">◆</div><div class="label">ABOUT.TXT</div></div>
    <div class="d-icon" data-app="projects"><div class="glyph">▣</div><div class="label">PROJECTS</div></div>
    <div class="d-icon" data-app="skills"><div class="glyph">▤</div><div class="label">SKILLS.SYS</div></div>
    <div class="d-icon" data-app="contact"><div class="glyph">✉</div><div class="label">CONTACT.EXE</div></div>
    <div class="d-icon" data-app="resume"><div class="glyph">▦</div><div class="label">RESUME.PDF</div></div>
  </div>
</div>

<div id="taskbar">
  <div id="start-btn">☰ START</div>
  <div id="task-items"></div>
  <div id="clock">00:00:00</div>
</div>

<div id="start-menu">
  <div class="sm-head">REYES_OS v2.6</div>
  <div class="sm-item" data-app="about">◆ About.txt</div>
  <div class="sm-item" data-app="projects">▣ Projects/</div>
  <div class="sm-item" data-app="skills">▤ Skills.sys</div>
  <div class="sm-item" data-app="contact">✉ Contact.exe</div>
  <div class="sm-item" data-app="resume">▦ Resume.pdf</div>
</div>

<div class="modal-mini" id="proj-modal">
  <div class="modal-mini-box">
    <h3 class="app-h" id="proj-modal-title">PROJECT</h3>
    <p id="proj-modal-body"></p>
    <button class="modal-mini-close" id="proj-modal-close">CLOSE</button>
  </div>
</div>

<script>
/* ================= BOOT SEQUENCE ================= */
const bootLog = document.getElementById('boot-log');
const bootLines = [
  'REYES_OS v2.6 — BOOT LOADER',
  'Checking memory..................... OK',
  'Mounting /career......................... OK',
  'Mounting /projects....................... OK',
  'Mounting /skills.sys..................... OK',
  'Loading window manager................... OK',
  'Starting desktop shell................... OK',
  '',
  'Welcome, operator. Type is optional — click around instead.',
];
let li = 0;
function typeBootLine(){
  if(li >= bootLines.length){
    setTimeout(()=>{
      document.getElementById('boot').classList.add('hidden');
      setTimeout(()=>document.getElementById('boot').style.display='none', 550);
    }, 400);
    return;
  }
  const p = document.createElement('p');
  p.textContent = bootLines[li];
  bootLog.appendChild(p);
  li++;
  setTimeout(typeBootLine, li===1?250:120);
}
setTimeout(typeBootLine, 300);

/* ================= CLOCK ================= */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-GB');
}
setInterval(tickClock, 1000); tickClock();

/* ================= WINDOW MANAGER ================= */
let zTop = 20;
const openWindows = {};

const APP_DEFS = {
  about: {title:'ABOUT.TXT', w:460, h:380, render: renderAbout},
  projects: {title:'PROJECTS/', w:480, h:420, render: renderProjects},
  skills: {title:'SKILLS.SYS', w:420, h:420, render: renderSkills},
  contact: {title:'CONTACT.EXE', w:420, h:460, render: renderContact},
  resume: {title:'RESUME.PDF', w:380, h:260, render: renderResume},
};

function openApp(id){
  if(openWindows[id]){
    focusWindow(openWindows[id].el);
    return;
  }
  const def = APP_DEFS[id];
  const el = document.createElement('div');
  el.className = 'window';
  el.style.width = def.w+'px';
  el.style.minHeight = def.h+'px';
  const offset = Object.keys(openWindows).length * 26;
  el.style.left = (140 + offset)+'px';
  el.style.top = (70 + offset)+'px';
  el.style.zIndex = ++zTop;

  el.innerHTML = `
    <div class="win-titlebar" data-drag>
      <span class="win-title">${def.title}</span>
      <div class="win-controls">
        <div class="win-btn" data-min>_</div>
        <div class="win-btn" data-close>X</div>
      </div>
    </div>
    <div class="win-body">${def.render()}</div>
    <div class="win-statusbar"><span>READY</span><span>REYES_OS</span></div>
    <div class="win-resize"></div>
  `;
  document.getElementById('desktop').appendChild(el);
  openWindows[id] = {el};
  makeDraggable(el);
  makeResizable(el);
  el.addEventListener('mousedown', ()=>focusWindow(el));
  el.querySelector('[data-close]').addEventListener('click', ()=>closeApp(id));
  el.querySelector('[data-min]').addEventListener('click', ()=>toggleMin(id));

  addTaskItem(id, def.title);
  focusWindow(el);
  postRenderHooks(id, el);
}

function closeApp(id){
  if(!openWindows[id]) return;
  openWindows[id].el.remove();
  delete openWindows[id];
  removeTaskItem(id);
}
function toggleMin(id){
  const w = openWindows[id];
  if(!w) return;
  w.el.style.display = (w.el.style.display==='none') ? 'flex' : 'none';
}
function focusWindow(el){
  el.style.zIndex = ++zTop;
  document.querySelectorAll('.task-item').forEach(t=>t.classList.remove('active'));
  const id = Object.keys(openWindows).find(k=>openWindows[k].el===el);
  if(id){
    const t = document.querySelector(`.task-item[data-app="${id}"]`);
    if(t) t.classList.add('active');
    if(el.style.display==='none') el.style.display='flex';
  }
}

function addTaskItem(id, title){
  const t = document.createElement('div');
  t.className = 'task-item';
  t.dataset.app = id;
  t.textContent = title;
  t.addEventListener('click', ()=>{
    const w = openWindows[id];
    if(w.el.style.display==='none'){ w.el.style.display='flex'; }
    else if(parseInt(w.el.style.zIndex) === zTop){ w.el.style.display='none'; return; }
    focusWindow(w.el);
  });
  document.getElementById('task-items').appendChild(t);
}
function removeTaskItem(id){
  const t = document.querySelector(`.task-item[data-app="${id}"]`);
  if(t) t.remove();
}

function makeDraggable(el){
  const bar = el.querySelector('[data-drag]');
  let ox=0, oy=0, dragging=false;
  bar.addEventListener('mousedown', e=>{
    dragging = true;
    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;
    focusWindow(el);
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    let nx = e.clientX - ox;
    let ny = e.clientY - oy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - 100));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 80));
    el.style.left = nx+'px';
    el.style.top = ny+'px';
  });
  window.addEventListener('mouseup', ()=>dragging=false);
}
function makeResizable(el){
  const handle = el.querySelector('.win-resize');
  let resizing=false, sx=0, sy=0, sw=0, sh=0;
  handle.addEventListener('mousedown', e=>{
    resizing = true; sx=e.clientX; sy=e.clientY;
    sw = el.offsetWidth; sh = el.offsetHeight;
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!resizing) return;
    el.style.width = Math.max(260, sw + (e.clientX-sx))+'px';
    el.style.minHeight = Math.max(200, sh + (e.clientY-sy))+'px';
  });
  window.addEventListener('mouseup', ()=>resizing=false);
}

/* ================= DESKTOP + START MENU WIRING ================= */
document.querySelectorAll('.d-icon').forEach(icon=>{
  let clicks = 0;
  icon.addEventListener('click', ()=>{
    clicks++;
    setTimeout(()=>{ if(clicks>=2) openApp(icon.dataset.app); clicks=0; }, 260);
  });
});
const startBtn = document.getElementById('start-btn');
const startMenu = document.getElementById('start-menu');
startBtn.addEventListener('click', (e)=>{ startMenu.classList.toggle('open'); e.stopPropagation(); });
document.addEventListener('click', (e)=>{ if(!startMenu.contains(e.target) && e.target!==startBtn) startMenu.classList.remove('open'); });
document.querySelectorAll('.sm-item').forEach(item=>{
  item.addEventListener('click', ()=>{ openApp(item.dataset.app); startMenu.classList.remove('open'); });
});

/* ================= APP CONTENT RENDERERS ================= */
function renderAbout(){
  return `
    <h3 class="app-h">OPERATOR PROFILE</h3>
    <p style="margin-bottom:10px;">I'm <b>Ethan Reyes</b>, a full-stack engineer who treats every product like a system that has to survive contact with real users.</p>
    <p style="margin-bottom:10px;">7+ years building across fintech, dev tooling, and applied AI — architecting backends, shipping interfaces, and closing the loop between the two.</p>
    <p style="margin-bottom:14px;">Off duty: reverse-engineering old hardware and contributing to open-source robotics tooling.</p>
    <div class="kv-row"><span>ROLE</span><span>Sr. Full-Stack Engineer</span></div>
    <div class="kv-row"><span>BASE</span><span>Remote / Global</span></div>
    <div class="kv-row"><span>EXPERIENCE</span><span>7+ years</span></div>
    <div class="kv-row"><span>STATUS</span><span>Open to work</span></div>
  `;
}
function renderProjects(){
  const list = [
    {id:'p1', name:'Aegis — Realtime Fraud Engine', sub:'Streaming risk-scoring @ 2M+ tx/day', tags:['Node.js','Kafka','Redis'], detail:'Built the core scoring pipeline from scratch: ingest, feature computation, and a rules + ML hybrid decision layer. Cut fraud losses by 34% while keeping false positives under 1.2%.'},
    {id:'p2', name:'Orbit — Dev Tooling Suite', sub:'Unified deploy CLI across 40+ repos', tags:['TypeScript','Go','Docker'], detail:'Replaced a tangle of manual scripts with one unified tool: build, test, and deploy any service, plus a live dashboard for fleet health. Adopted org-wide within two months.'},
    {id:'p3', name:'Lumen — AI Research Assistant', sub:'Natural-language search over internal docs', tags:['Python','LangChain','Next.js'], detail:'Designed the retrieval architecture and prompt orchestration, plus a citation system so every answer traces to its source. Cut average lookup time from ~15 min to under 30 sec.'},
  ];
  window.__projects = list;
  return `
    <h3 class="app-h">DEPLOYED / PROJECTS</h3>
    ${list.map(p=>`
      <div class="proj-entry" data-proj="${p.id}">
        <div class="proj-title">${p.name}</div>
        <div class="proj-sub">${p.sub}</div>
        <div>${p.tags.map(t=>`<span class="proj-tag">${t}</span>`).join('')}</div>
      </div>
    `).join('')}
  `;
}
function renderSkills(){
  return `
    <h3 class="app-h">SYSTEM MONITOR</h3>
    <div id="meter-holder">
      ${[
        ['JavaScript / TypeScript',96],['React / Next.js',93],['Node.js / APIs',90],
        ['Python / AI Tooling',87],['Cloud / AWS',82],['Systems Design',85]
      ].map(([n,p])=>`
        <div class="meter-row">
          <div class="meter-label"><span>${n}</span><span>${p}%</span></div>
          <div class="meter-track"><div class="meter-fill" data-pct="${p}"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}
function renderContact(){
  return `
    <h3 class="app-h">OPEN CHANNEL</h3>
    <div class="term-out" id="contact-term"><p>&gt; channel ready. fill the form and hit send.</p></div>
    <form id="os-contact-form">
      <div class="form-row"><label>Name</label><input type="text" required></div>
      <div class="form-row"><label>Email</label><input type="email" required></div>
      <div class="form-row"><label>Message</label><textarea rows="3" required></textarea></div>
      <button type="submit" class="send-btn">SEND</button>
    </form>
  `;
}
function renderResume(){
  return `
    <h3 class="app-h">RESUME.PDF</h3>
    <p style="margin-bottom:12px;">Preview unavailable in this sandboxed OS. Swap this button's link for your real resume file.</p>
    <a href="#" class="send-btn" style="display:inline-block;text-decoration:none;">↓ DOWNLOAD RESUME</a>
  `;
}

/* ================= POST-RENDER HOOKS (per app) ================= */
function postRenderHooks(id, el){
  if(id==='skills'){
    setTimeout(()=>{
      el.querySelectorAll('.meter-fill').forEach(f=>{ f.style.width = f.dataset.pct+'%'; });
    }, 100);
  }
  if(id==='projects'){
    el.querySelectorAll('.proj-entry').forEach(entry=>{
      entry.addEventListener('click', ()=>{
        const p = window.__projects.find(x=>x.id===entry.dataset.proj);
        document.getElementById('proj-modal-title').textContent = p.name.toUpperCase();
        document.getElementById('proj-modal-body').textContent = p.detail;
        document.getElementById('proj-modal').classList.add('open');
      });
    });
  }
  if(id==='contact'){
    const form = el.querySelector('#os-contact-form');
    const out = el.querySelector('#contact-term');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const p1 = document.createElement('p'); p1.textContent='> transmitting...'; out.appendChild(p1);
      out.scrollTop = out.scrollHeight;
      setTimeout(()=>{
        const p2 = document.createElement('p'); p2.textContent='> message sent successfully. standing by.'; out.appendChild(p2);
        out.scrollTop = out.scrollHeight;
        form.reset();
      }, 900);
    });
  }
}

document.getElementById('proj-modal-close').addEventListener('click', ()=>{
  document.getElementById('proj-modal').classList.remove('open');
});
document.getElementById('proj-modal').addEventListener('click', e=>{
  if(e.target.id==='proj-modal') e.target.classList.remove('open');
});

/* auto-open About on first load, after boot */
setTimeout(()=>{ openApp('about'); }, 3200);
